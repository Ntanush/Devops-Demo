# Harness K8s manifest (Go templating with values.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.name}}
  namespace: {{.Values.namespace}}
  labels:
    app: devops-demo
    version: {{.Values.version}}
spec:
  replicas: {{int .Values.replicas}}
  selector:
    matchLabels:
      app: devops-demo
      version: {{.Values.version}}
  template:
    metadata:
      labels:
        app: devops-demo
        version: {{.Values.version}}
    spec:
      containers:
        - name: app
          image: {{.Values.image}}
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "{{.Values.version}}"
            - name: APP_COLOR
              value: "{{.Values.color}}"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: devops-demo
  namespace: {{.Values.namespace}}
spec:
  selector:
    app: devops-demo
  ports:
    - name: http
      port: 80
      targetPort: 8080
