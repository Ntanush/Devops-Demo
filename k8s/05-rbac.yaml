# A read-only "developer" identity limited to the demo namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-viewer
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-viewer-binding
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: dev-viewer
    namespace: demo
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
---
# A "deployer" identity (what a CD tool like Harness needs) - can change deployments, not RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-deployer
  namespace: demo
rules:
  - apiGroups: ["", "apps", "autoscaling"]
    resources: ["pods", "services", "configmaps", "secrets", "deployments", "replicasets", "horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-binding
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: demo
roleRef:
  kind: Role
  name: app-deployer
  apiGroup: rbac.authorization.k8s.io
