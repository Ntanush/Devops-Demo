apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-demo-v1
  namespace: demo
  labels:
    app: devops-demo
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-demo
      version: v1
  template:
    metadata:
      labels:
        app: devops-demo
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: app
          image: devops-demo:v1          # built inside minikube (see README)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "v1"
            - name: APP_COLOR
              value: "#2b7de9"
          resources:                      # requests are REQUIRED for HPA CPU %
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
