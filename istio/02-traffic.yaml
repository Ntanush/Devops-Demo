# Ingress gateway -> VirtualService (80/20 canary) -> DestinationRule subsets
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: demo
spec:
  selector:
    istio: ingressgateway
  servers:
    - port: { number: 80, name: http, protocol: HTTP }
      hosts: ["*"]
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: devops-demo
  namespace: demo
spec:
  host: devops-demo
  subsets:
    - name: v1
      labels: { version: v1 }
    - name: v2
      labels: { version: v2 }
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: devops-demo
  namespace: demo
spec:
  hosts: ["*"]
  gateways: ["demo-gateway"]
  http:
    - route:
        - destination: { host: devops-demo, subset: v1 }
          weight: 80
        - destination: { host: devops-demo, subset: v2 }
          weight: 20
      retries:
        attempts: 3
        perTryTimeout: 2s
---
# Enforce mutual TLS between all pods in the namespace
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: demo
spec:
  mtls:
    mode: STRICT
